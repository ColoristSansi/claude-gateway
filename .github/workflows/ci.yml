name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: check.ps1 -Quick -Replay
        shell: pwsh
        run: ./check.ps1 -Quick -Replay

  # 打 tag 出包（票 54；签名与更新清单见票 61）：NSIS per-user 安装包 + 免安装 zip +
  # 签名产物 + 带签名的 latest.json。与手工打包共用 pack.ps1，不另写一套配置。
  #
  # 签名密钥（票 63 现场配，本票不碰）：
  #   TAURI_SIGNING_PRIVATE_KEY          Secret，私钥**内容**（不是路径）
  #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD Secret，私钥口令
  # 没配也照样出包：只是不打签名，latest.json 是明写着「不可用于自动更新」的占位。
  bundle:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pack.ps1 用 cargo tauri build；runner 上没有 cargo-tauri，现装（与本地 2.12.2 对齐）。
      - name: 装 tauri-cli
        run: cargo install tauri-cli --version 2.12.2 --locked
      - name: pack.ps1（NSIS + zip + 签名 + latest.json）
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # latest.json 里的下载地址：这个 tag 的 Release 资产。上架 Release 本身在票 63 现场做。
          $baseUrl = "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            ./pack.ps1 -Sign -BaseUrl $baseUrl
          } else {
            Write-Warning '没有 TAURI_SIGNING_PRIVATE_KEY（票 63 现场配 Secret）：本次不打签名，latest.json 只是占位，不能用于自动更新。'
            ./pack.ps1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: claude-gateway-${{ github.ref_name }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/updates/*
            target/release/bundle/zip/*
