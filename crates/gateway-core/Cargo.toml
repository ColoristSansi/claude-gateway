[package]
name = "gateway-core"
version = "0.1.0"
edition = "2021"
description = "本地模型网关内核：ingress / IR / binding / egress / obs / store / writer"

# 约束：不依赖 Tauri（ADR-0007 第 1 条）。依赖集跟着原型 Cargo.toml 里与转换/存储相关的部分走。
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs", "sync"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
# preserve_order：写入引擎要「JSON 保键序 + 位移删除」（spec §8.4 第 5 条）——Map 缺省是 BTreeMap，会按名排序。
serde_json = { version = "1", features = ["preserve_order"] }
# TOML 保序改写（spec §8.4 第 5 条）：toml_edit 保留原有键序、注释与格式，只改接管键。
toml_edit = "0.25"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
bytes = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
anyhow = "1"
# 导出文件的口令加密（票 62）：PBKDF2-HMAC-SHA256 派生 + AES-256-GCM。ring 本来就在 Cargo.lock
# 里（Tauri 依赖树），不引新 crate、不手搓密码学。
ring = "0.17"
# `/api/tags` 的 `digest` = 虚拟模型名的确定性 sha256（spec §4.4）；手写 SHA-256 不值当。
sha2 = "0.10"

# DPAPI（CryptProtectData / CryptUnprotectData）：密钥只以密文入库（spec §9）。
# FileSystem：原子替换 ReplaceFileW（spec §8.4 第 1 条）；SystemInformation：备份文件名的本地时间。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    # 开机自启（票 62）：HKCU\...\Run 值的读 / 写 / 删。
    "Win32_System_Registry",
] }

# 测试专用开关（票 41）：开它才编 mock 上游与回放 harness 两个 bin，以及回放集成测试。
# 产品构建（`cargo build -p gateway-core -p claude-gateway`）不带它——产物里既没有 mock 的
# 路由字符串（`/__chunks`、`/api/echo`），网关运行态里也没有 mock 那两格状态。
[features]
mock = []

# 测试专用 bin：mock 上游（回放 fixtures）与回放用的网关 harness，二者**分进程**跑。
[[bin]]
name = "mock-upstream"
path = "src/bin/mock-upstream.rs"
required-features = ["mock"]

[[bin]]
name = "gateway-harness"
path = "src/bin/gateway-harness.rs"
required-features = ["mock"]

# 回放集成测试（12 格）：要 `--features mock` 才有两个 bin 可拉起来。
[[test]]
name = "replay"
path = "tests/replay.rs"
required-features = ["mock"]
